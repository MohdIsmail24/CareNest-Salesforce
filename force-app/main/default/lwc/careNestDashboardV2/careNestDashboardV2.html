<template>
    <div class="care-internal-app">
        <!-- 0. TOP UTILITY RIBBON -->
        <header class="care-utility-bar">
            <div class="care-utility-container">
                <div class="care-utility-left">
                    <span class="care-live-indicator">
                        <span class="care-pulse-dot"></span>
                        LIVE HOSPITAL COMMAND CENTER
                    </span>
                    <span class="care-utility-divider">|</span>
                    <span class="care-utility-text">CareNest Enterprise Healthcare Platform</span>
                    <span class="care-utility-divider">|</span>
                    <span class="care-utility-hotline">
                        <lightning-icon icon-name="utility:call" size="x-small" class="care-icon-emergency"></lightning-icon>
                        Emergency Hotline Ext: <strong>911 / 4567</strong>
                    </span>
                </div>
                <div class="care-utility-right">
                    <span class="care-staff-badge">
                        <lightning-icon icon-name="utility:identity" size="x-small"></lightning-icon>
                        <span class="care-staff-name">{userName}</span>
                        <span class="care-staff-role">({activeRoleLabel})</span>
                    </span>
                    <template if:true={metrics}>
                        <span class="care-kpi-chip">
                            <span class="care-kpi-chip-label">Occupancy:</span>
                            <span class="care-kpi-chip-val">{metrics.overallOccupancyRate}%</span>
                        </span>
                        <span class="care-kpi-chip">
                            <span class="care-kpi-chip-label">Inpatients:</span>
                            <span class="care-kpi-chip-val">{metrics.activeAdmissions}</span>
                        </span>
                        <span class="care-kpi-chip">
                            <span class="care-kpi-chip-label">Beds:</span>
                            <span class="care-kpi-chip-val">{metrics.availableBeds} Avail / {metrics.totalBeds}</span>
                        </span>
                    </template>
                </div>
            </div>
        </header>

        <!-- 1. STICKY BRANDED NAVIGATION HEADER -->
        <nav class="care-brand-nav">
            <div class="care-brand-nav-container">
                <!-- Logo & System Identity -->
                <div class="care-logo-group" onclick={handleLogoClick}>
                    <div class="care-logo-mark">
                        <svg class="care-logo-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="32" height="32" rx="8" fill="#0d9488"/>
                            <path d="M16 8V24M8 16H24" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="care-logo-text">
                        <div class="care-logo-title">CareNest</div>
                        <div class="care-logo-tagline">Hospital Admin Command Center</div>
                    </div>
                </div>

                <!-- Navigation Tabs (Pills) with Scroll Controls -->
                <div class="care-nav-pills-container">
                    <button class="care-nav-scroll-btn care-nav-scroll-left" onclick={handleScrollNavLeft} title="Scroll modules left" aria-label="Scroll left">
                        <lightning-icon icon-name="utility:chevronleft" size="xx-small"></lightning-icon>
                    </button>
                    <div class="care-nav-pills-wrapper">
                        <div class="care-nav-pills">
                            <template for:each={navItems} for:item="item">
                                <button
                                    key={item.id}
                                    class={item.buttonClass}
                                    data-id={item.id}
                                    onclick={handleNavClick}>
                                    <lightning-icon icon-name={item.icon} size="x-small" class="care-pill-icon"></lightning-icon>
                                    <span>{item.label}</span>
                                    <template if:true={item.badge}>
                                        <span class="care-pill-badge">{item.badge}</span>
                                    </template>
                                </button>
                            </template>
                        </div>
                    </div>
                    <button class="care-nav-scroll-btn care-nav-scroll-right" onclick={handleScrollNavRight} title="Scroll modules right" aria-label="Scroll right">
                        <lightning-icon icon-name="utility:chevronright" size="xx-small"></lightning-icon>
                    </button>
                </div>

                <!-- Header Actions -->
                <div class="care-nav-actions">
                    <!-- All Modules Dropdown Launcher -->
                    <div class="care-modules-dropdown-wrapper">
                        <button class="care-btn-all-modules" onclick={handleToggleModulesDropdown} aria-expanded={showModulesDropdown} title="View all 12 modules">
                            <lightning-icon icon-name="utility:apps" size="x-small" class="care-btn-icon"></lightning-icon>
                            <span>All Modules</span>
                            <lightning-icon icon-name="utility:down" size="xx-small" class="care-btn-icon-right"></lightning-icon>
                        </button>
                        <template if:true={showModulesDropdown}>
                            <div class="care-modules-menu" role="menu">
                                <div class="care-modules-menu-header">12 Hospital Management Modules</div>
                                <div class="care-modules-menu-grid">
                                    <template for:each={navItems} for:item="item">
                                        <button key={item.id} class="care-module-menu-item" data-id={item.id} onclick={handleSelectModule} role="menuitem">
                                            <lightning-icon icon-name={item.icon} size="small" class="care-menu-icon"></lightning-icon>
                                            <div class="care-menu-item-text">
                                                <span class="care-menu-item-label">{item.label}</span>
                                            </div>
                                            <template if:true={item.badge}>
                                                <span class="care-pill-badge">{item.badge}</span>
                                            </template>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <button class="care-btn-register" onclick={handleQuickRegisterPatient}>
                        <lightning-icon icon-name="utility:add" size="x-small" class="care-btn-icon"></lightning-icon>
                        <span>Register Patient</span>
                    </button>
                    <!-- Mobile Hamburger Toggle -->
                    <button class="care-mobile-toggle" onclick={handleToggleMobileMenu} aria-label="Toggle navigation menu">
                        <lightning-icon icon-name="utility:rows" size="small"></lightning-icon>
                    </button>
                </div>
            </div>

            <!-- Mobile Navigation Drawer -->
            <template if:true={showMobileMenu}>
                <div class="care-mobile-drawer">
                    <template for:each={navItems} for:item="item">
                        <button
                            key={item.id}
                            class={item.mobileClass}
                            data-id={item.id}
                            onclick={handleMobileNavClick}>
                            <lightning-icon icon-name={item.icon} size="small" class="care-mobile-icon"></lightning-icon>
                            <span>{item.label}</span>
                        </button>
                    </template>
                </div>
            </template>
        </nav>

        <!-- 2. CLINICAL ALERT BANNER (If Active Abnormal Vitals Detected) -->
        <template if:true={hasActiveAlerts}>
            <div class="care-alert-strip">
                <div class="care-alert-inner">
                    <lightning-icon icon-name="utility:warning" size="small" class="care-alert-icon"></lightning-icon>
                    <div class="care-alert-content">
                        <strong>URGENT CLINICAL ALERT:</strong> {metrics.activeClinicalAlerts} abnormal patient vital signs require immediate review in the Clinical Chart workspace.
                    </div>
                    <button class="care-alert-action-btn" data-id="clinical" onclick={handleNavClick}>
                        Review Patient Vitals &rarr;
                    </button>
                </div>
            </div>
        </template>

        <!-- 3. MAIN WORKSPACE CONTAINER -->
        <main class="care-main-viewport">
            <!-- Loading Indicator -->
            <template if:true={isLoading}>
                <div class="care-loading-container">
                    <lightning-spinner alternative-text="Loading CareNest workspace..." size="medium"></lightning-spinner>
                    <p class="care-loading-text">Synchronizing authorized hospital operations telemetry...</p>
                </div>
            </template>

            <template if:false={isLoading}>
                <!-- =========================================================
                     MODULE 1: EXECUTIVE HOSPITAL COMMAND CENTER (HERO + KPIS)
                     ========================================================= -->
                <template if:true={isOverviewTab}>
                    <div class="care-command-center">
                        <!-- A. PHOTOGRAPHIC HERO BANNER -->
                        <div class="care-hero-banner" style={heroImageStyle}>
                            <div class="care-hero-overlay-content">
                                <div class="care-hero-badge-row">
                                    <span class="care-hero-pill-teal">
                                        <lightning-icon icon-name="utility:check" size="xx-small" class="care-icon-white"></lightning-icon>
                                        Tertiary Hospital Care
                                    </span>
                                    <span class="care-hero-pill-dark">
                                        <lightning-icon icon-name="utility:shield" size="xx-small" class="care-icon-white"></lightning-icon>
                                        Zero-Trust Stage 2 RBAC
                                    </span>
                                    <span class="care-hero-pill-dark">
                                        <lightning-icon icon-name="utility:connected_apps" size="xx-small" class="care-icon-white"></lightning-icon>
                                        Live Telemetry: Online
                                    </span>
                                    <span class="care-hero-pill-dark">
                                        <lightning-icon icon-name="utility:lock" size="xx-small" class="care-icon-white"></lightning-icon>
                                        HIPAA &amp; DISHA Compliant
                                    </span>
                                </div>
                                <h1 class="care-hero-title">Welcome, Hospital Administration</h1>
                                <p class="care-hero-subtitle">
                                    Executive Command Center — Real-time inpatient bed allocation, clinical rounds telemetry, outpatient capacity, and enterprise hospital governance.
                                </p>
                                <div class="care-hero-actions-row">
                                    <button class="care-hero-btn-primary" onclick={handleQuickRegisterPatient}>
                                        <lightning-icon icon-name="utility:user" size="x-small" class="care-icon-white"></lightning-icon>
                                        <span>+ Register Patient</span>
                                    </button>
                                    <button class="care-hero-btn-secondary" data-id="admissions" onclick={handleNavClick}>
                                        <lightning-icon icon-name="utility:hospital" size="x-small" class="care-icon-teal"></lightning-icon>
                                        <span>Inpatient Admissions</span>
                                    </button>
                                    <button class="care-hero-btn-secondary" data-id="appointments" onclick={handleNavClick}>
                                        <lightning-icon icon-name="utility:event" size="x-small" class="care-icon-teal"></lightning-icon>
                                        <span>Schedule OPD Slot</span>
                                    </button>
                                    <button class="care-hero-btn-secondary" data-id="clinical" onclick={handleNavClick}>
                                        <lightning-icon icon-name="utility:heart" size="x-small" class="care-icon-teal"></lightning-icon>
                                        <span>Clinical &amp; Vitals</span>
                                    </button>
                                    <button class="care-hero-btn-accent" data-id="adminOverview" onclick={handleNavClick}>\n                                        <lightning-icon icon-name="utility:graph" size="x-small" class="care-icon-white"></lightning-icon>\n                                        <span>Executive Analytics</span>\n                                    </button>\n                                    <button class="care-hero-btn-secondary" data-id="billing" onclick={handleNavClick}>
                                        <lightning-icon icon-name="utility:currency" size="x-small" class="care-icon-teal"></lightning-icon>
                                        <span>Billing &amp; Payments</span>
                                    </button>
                                    <button class="care-hero-btn-glass" onclick={handleRefresh} title="Synchronize latest live data">
                                        <lightning-icon icon-name="utility:refresh" size="x-small" class="care-icon-white"></lightning-icon>
                                        <span>Sync Live Data</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- B. FLOATING EXECUTIVE KPI MATRIX (12 METRICS) -->
                        <template if:true={metrics}>
                            <div class="care-kpi-matrix-grid">
                                <!-- Card 1: Active Inpatients -->
                                <div class="care-kpi-card care-kpi-navy" data-id="admissions" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Inpatients</span>
                                        <lightning-icon icon-name="standard:hospital" size="small"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">{metrics.activeAdmissions}</div>
                                    <div class="care-kpi-meta">Current Admitted Census</div>
                                </div>

                                <!-- Card 2: Total Beds -->
                                <div class="care-kpi-card care-kpi-teal" data-id="wards" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Total Beds</span>
                                        <lightning-icon icon-name="standard:asset_relationship" size="small"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">{metrics.totalBeds}</div>
                                    <div class="care-kpi-meta">Across 5 Hospital Wards</div>
                                </div>

                                <!-- Card 3: Occupied Beds -->
                                <div class="care-kpi-card care-kpi-amber" data-id="wards" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Occupied Beds</span>
                                        <lightning-icon icon-name="utility:bed" size="small" class="care-icon-amber"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">{metrics.occupiedBeds}</div>
                                    <div class="care-kpi-meta">{metrics.overallOccupancyRate}% Occupancy Rate</div>
                                </div>

                                <!-- Card 4: Available Beds -->
                                <div class="care-kpi-card care-kpi-green" data-id="wards" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Available Beds</span>
                                        <lightning-icon icon-name="utility:check" size="small" class="care-icon-green"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">{metrics.availableBeds}</div>
                                    <div class="care-kpi-meta">Ready For Immediate Intake</div>
                                </div>

                                <!-- Card 5: Active Doctors -->
                                <div class="care-kpi-card care-kpi-slate" data-id="doctors" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Active Doctors</span>
                                        <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">{metrics.totalDoctors}</div>
                                    <div class="care-kpi-meta">Credentialed Physicians</div>
                                </div>

                                <!-- Card 6: Clinical Alerts -->
                                <div class="care-kpi-card care-kpi-red" data-id="clinical" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Clinical Alerts</span>
                                        <lightning-icon icon-name="utility:warning" size="small" class="care-icon-red"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">{metrics.activeClinicalAlerts}</div>
                                    <div class="care-kpi-meta">Abnormal Vitals Flagged</div>
                                </div>

                                <!-- Card 7: Appointments Today -->
                                <div class="care-kpi-card care-kpi-teal" data-id="appointments" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Today OPD</span>
                                        <lightning-icon icon-name="standard:event" size="small"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">{metrics.todayAppointments}</div>
                                    <div class="care-kpi-meta">Scheduled Consultations</div>
                                </div>

                                <!-- Card 8: Upcoming Slots -->
                                <div class="care-kpi-card care-kpi-slate" data-id="appointments" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Upcoming Booked</span>
                                        <lightning-icon icon-name="utility:date_time" size="small"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">{metrics.upcomingAppointments}</div>
                                    <div class="care-kpi-meta">Confirmed Bookings</div>
                                </div>

                                <!-- Card 9: Recorded Collections -->
                                <div class="care-kpi-card care-kpi-green" data-id="billing" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Collections</span>
                                        <lightning-icon icon-name="standard:currency" size="small"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">₹{metrics.totalPaid}</div>
                                    <div class="care-kpi-meta">Recorded Successful Collections</div>
                                </div>

                                <!-- Card 10: Outstanding Arrears -->
                                <div class="care-kpi-card care-kpi-amber" data-id="billing" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Outstanding</span>
                                        <lightning-icon icon-name="utility:moneybag" size="small" class="care-icon-amber"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">₹{metrics.totalOutstanding}</div>
                                    <div class="care-kpi-meta">Unsettled Patient Invoices</div>
                                </div>

                                <!-- Card 11: Patient Population -->
                                <div class="care-kpi-card care-kpi-navy" data-id="patients" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Patients</span>
                                        <lightning-icon icon-name="standard:user" size="small"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">113</div>
                                    <div class="care-kpi-meta">Enrolled (164 Total Contacts)</div>
                                </div>

                                <!-- Card 12: Recovery Ratio -->
                                <div class="care-kpi-card care-kpi-teal" data-id="billing" onclick={handleNavClick}>
                                    <div class="care-kpi-card-header">
                                        <span class="care-kpi-tag">Collection Rate</span>
                                        <lightning-icon icon-name="utility:trending" size="small"></lightning-icon>
                                    </div>
                                    <div class="care-kpi-metric-val">{collectionRate}%</div>
                                    <div class="care-kpi-meta">Fiscal Efficiency Index</div>
                                </div>
                            </div>
                        </template>

                        <!-- C. SPLIT OPERATIONS & TELEMETRY PANELS -->
                        <div class="care-command-grid">
                            <!-- LEFT COLUMN (60%): Ward Capacity & Financials -->
                            <div class="care-grid-col-left">
                                <!-- Ward Occupancy Matrix -->
                                <div class="care-card-panel">
                                    <div class="care-panel-header">
                                        <div>
                                            <h3 class="care-panel-title">Real-Time Ward Capacity &amp; Occupancy Matrix</h3>
                                            <p class="care-panel-sub">Live telemetry across 5 inpatient wards and 42 bed assignments.</p>
                                        </div>
                                        <button class="care-panel-action-link" data-id="wards" onclick={handleNavClick}>
                                            Manage Wards &rarr;
                                        </button>
                                    </div>

                                    <div class="care-ward-list">
                                        <template for:each={wardSummaries} for:item="ward">
                                            <div key={ward.wardId} class="care-ward-row">
                                                <div class="care-ward-meta-col">
                                                    <div class="care-ward-name-row">
                                                        <span class="care-ward-title">{ward.name}</span>
                                                        <span class="care-ward-code-badge">{ward.wardCode}</span>
                                                        <span class="care-ward-type-badge">{ward.wardType} • Floor {ward.floor}</span>
                                                    </div>
                                                    <div class="care-ward-progress-wrapper">
                                                        <div class="care-ward-progress-bar">
                                                            <div class={ward.barClass} style={ward.progressStyle}></div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="care-ward-stat-col">
                                                    <span class="care-ward-occ-text"><strong>{ward.occupiedBeds}</strong> / {ward.totalBeds} Beds ({ward.occupancyRate}%)</span>
                                                    <span class={ward.availableBadgeClass}>
                                                        {ward.availableBeds} Avail
                                                    </span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Financial & Revenue Overview -->
                                <div class="care-card-panel slds-m-top_medium">
                                    <div class="care-panel-header">
                                        <div>
                                            <h3 class="care-panel-title">Hospital Revenue &amp; Financial Governance</h3>
                                            <p class="care-panel-sub">Real-time ledger aggregation from authorized Payment records.</p>
                                        </div>
                                        <button class="care-panel-action-link" data-id="billing" onclick={handleNavClick}>
                                            Open Ledger &rarr;
                                        </button>
                                    </div>

                                    <template if:true={metrics}>
                                        <div class="care-finance-summary-grid">
                                            <div class="care-finance-box">
                                                <div class="care-finance-label">Total Billed Invoices</div>
                                                <div class="care-finance-value">₹{metrics.totalBilled}</div>
                                                <div class="care-finance-sub">Cumulative Healthcare Billings</div>
                                            </div>
                                            <div class="care-finance-box care-finance-box-green">
                                                <div class="care-finance-label">Recorded Successful Collections</div>
                                                <div class="care-finance-value">₹{metrics.totalPaid}</div>
                                                <div class="care-finance-sub">69 Successful Payment Records</div>
                                            </div>
                                            <div class="care-finance-box care-finance-box-amber">
                                                <div class="care-finance-label">Outstanding Receivables</div>
                                                <div class="care-finance-value">₹{metrics.totalOutstanding}</div>
                                                <div class="care-finance-sub">Unsettled Patient Accounts</div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- RIGHT COLUMN (40%): Live Feed & Quick Actions -->
                            <div class="care-grid-col-right">
                                <!-- Real-Time Hospital Activity Stream -->
                                <div class="care-card-panel">
                                    <div class="care-panel-header">
                                        <div class="care-title-with-pulse">
                                            <span class="care-pulse-dot"></span>
                                            <div>
                                                <h3 class="care-panel-title">Live Hospital Activity Feed</h3>
                                                <p class="care-panel-sub">Stream of recent admissions and clinical vital sign telemetry.</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="care-activity-feed">
                                        <template for:each={recentActivities} for:item="act">
                                            <div key={act.id} class="care-activity-row">
                                                <div class="care-activity-icon-col">
                                                    <lightning-icon icon-name={act.iconName} size="small" class={act.iconClass}></lightning-icon>
                                                </div>
                                                <div class="care-activity-body">
                                                    <div class="care-activity-title">{act.title}</div>
                                                    <div class="care-activity-sub">{act.subtitle}</div>
                                                </div>
                                                <div class="care-activity-badge-col">
                                                    <span class={act.badgeStyle}>{act.badgeLabel}</span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Administrative Quick Launchpad -->
                                <div class="care-card-panel slds-m-top_medium">
                                    <div class="care-panel-header">
                                        <div>
                                            <h3 class="care-panel-title">Administrative Quick Launchpad</h3>
                                            <p class="care-panel-sub">Instant shortcuts to core departmental workspaces.</p>
                                        </div>
                                    </div>

                                    <div class="care-launchpad-grid">
                                        <button class="care-launchpad-btn" data-id="patients" onclick={handleNavClick}>
                                            <lightning-icon icon-name="standard:user" size="small"></lightning-icon>
                                            <span>Patient Directory</span>
                                        </button>
                                        <button class="care-launchpad-btn" data-id="doctors" onclick={handleNavClick}>
                                            <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                                            <span>Physician Staff</span>
                                        </button>
                                        <button class="care-launchpad-btn" data-id="appointments" onclick={handleNavClick}>
                                            <lightning-icon icon-name="standard:event" size="small"></lightning-icon>
                                            <span>Appointment Slots</span>
                                        </button>
                                        <button class="care-launchpad-btn" data-id="admissions" onclick={handleNavClick}>
                                            <lightning-icon icon-name="standard:hospital" size="small"></lightning-icon>
                                            <span>Bed Allocation</span>
                                        </button>
                                        <button class="care-launchpad-btn" data-id="clinical" onclick={handleNavClick}>
                                            <lightning-icon icon-name="standard:stethoscope" size="small"></lightning-icon>
                                            <span>Inpatient Charts</span>
                                        </button>
                                        <button class="care-launchpad-btn" data-id="reports" onclick={handleNavClick}>
                                            <lightning-icon icon-name="standard:report" size="small"></lightning-icon>
                                            <span>Operations Reports</span>
                                        </button>
                                        <button class="care-launchpad-btn" data-id="assistant" onclick={handleNavClick}>
                                            <lightning-icon icon-name="standard:einstein" size="small"></lightning-icon>
                                            <span>Agentforce AI</span>
                                        </button>
                                        <button class="care-launchpad-btn" data-id="automation" onclick={handleNavClick}>
                                            <lightning-icon icon-name="standard:process" size="small"></lightning-icon>
                                            <span>Automation Jobs</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
