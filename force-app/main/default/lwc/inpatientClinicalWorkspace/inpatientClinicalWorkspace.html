<template>
    <div class="care-container slds-p-around_medium">
        <!-- Header Banner -->
        <div class="slds-page-header slds-page-header_record-home care-header slds-m-bottom_medium">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <span class="slds-icon_container slds-icon-standard-stethoscope care-brand-icon">
                                <lightning-icon icon-name="standard:stethoscope" size="medium"></lightning-icon>
                            </span>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1 class="slds-page-header__title slds-truncate care-title" title="Inpatient Clinical Workspace &amp; Vital Signs Center">
                                        Inpatient Clinical Workspace &amp; Vital Signs Center
                                    </h1>
                                </div>
                            </div>
                            <p class="slds-page-header__name-meta care-subtitle">Multi-patient clinical rounds, encounter logging, vital monitoring, and critical alert triage</p>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <lightning-button 
                                label="Review ICU Critical Alert (Dev Malhotra)" 
                                variant="destructive" 
                                icon-name="utility:warning" 
                                onclick={handleJumpToDevMalhotra} 
                                class="slds-m-right_x-small">
                            </lightning-button>
                            <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh Workspace" title="Refresh Workspace" onclick={handleRefresh}></lightning-button-icon>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Master-Detail Dual Pane Layout -->
        <div class="slds-grid slds-wrap slds-gutters">
            <!-- Left Pane: Inpatient Directory (4-of-12) -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 slds-m-bottom_medium">
                <div class="slds-card care-panel-card">
                    <div class="slds-card__header slds-p-around_small care-panel-header">
                        <lightning-input
                            type="search"
                            placeholder="Filter patients by name or ward..."
                            value={searchTerm}
                            onchange={handleSearchChange}
                            variant="label-hidden">
                        </lightning-input>
                    </div>

                    <div class="slds-card__body slds-card__body_inner patient-list-body">
                        <template if:true={isLoadingPatients}>
                            <div class="slds-align_absolute-center slds-p-around_medium">
                                <lightning-spinner alternative-text="Loading patients..." size="small"></lightning-spinner>
                            </div>
                        </template>

                        <template if:false={isLoadingPatients}>
                            <template if:true={hasPatients}>
                                <div class="patient-list">
                                    <template for:each={patients} for:item="pat">
                                        <div 
                                            key={pat.admissionId} 
                                            class={pat.cardClass} 
                                            data-admission-id={pat.admissionId} 
                                            onclick={handleSelectPatientCard}>
                                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                                <div class="patient-card-name font-bold">{pat.patientName}</div>
                                                <template if:true={pat.hasActiveAlerts}>
                                                    <span class="slds-badge slds-theme_error alert-badge-pulse">
                                                        <lightning-icon icon-name="utility:warning" size="xx-small" variant="inverse" class="slds-m-right_xx-small"></lightning-icon>
                                                        {pat.alertCount} Alert
                                                    </span>
                                                </template>
                                            </div>
                                            <div class="slds-text-body_small text-muted">
                                                {pat.wardName} • <strong>{pat.bedCode}</strong> (Room {pat.room})
                                            </div>
                                            <div class="slds-grid slds-grid_align-spread slds-m-top_xx-small slds-text-body_small">
                                                <span class="text-slate-500">Dr: {pat.doctorName}</span>
                                                <span class="text-slate-400">{pat.admissionDate}</span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template if:false={hasPatients}>
                                <div class="slds-align_absolute-center slds-p-around_medium text-muted">
                                    No inpatients found.
                                </div>
                            </template>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Right Pane: Clinical Chart & Vital Monitor (8-of-12) -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 slds-m-bottom_medium">
                <template if:true={selectedPatient}>
                    <!-- Patient Summary Banner -->
                    <div class="slds-card care-patient-banner slds-p-around_medium slds-m-bottom_medium">
                        <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                                <div class="slds-media slds-media_center">
                                    <div class="slds-media__figure">
                                        <div class="patient-avatar">
                                            <lightning-icon icon-name="standard:avatar" size="medium"></lightning-icon>
                                        </div>
                                    </div>
                                    <div class="slds-media__body">
                                        <h2 class="patient-banner-title">{selectedPatient.patientName}</h2>
                                        <p class="patient-banner-subtitle">
                                            Admission #{selectedPatient.admissionNumber} • {selectedPatient.wardName} • Bed <strong>{selectedPatient.bedCode}</strong> (Room {selectedPatient.room})
                                        </p>
                                        <p class="patient-banner-meta">
                                            Attending: <strong>{selectedPatient.doctorName}</strong> ({selectedPatient.doctorSpecialty}) • Admitted: {selectedPatient.admissionDate}
                                        </p>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-text-align_right slds-m-top_small-only">
                                <lightning-button 
                                    label="Record Vitals" 
                                    variant="brand" 
                                    icon-name="utility:heart" 
                                    onclick={handleOpenRecordVitalModal} 
                                    class="slds-m-right_x-small">
                                </lightning-button>
                                <lightning-button 
                                    label="New Encounter" 
                                    variant="neutral" 
                                    icon-name="utility:note" 
                                    onclick={handleOpenNewEncounterModal}>
                                </lightning-button>
                            </div>
                        </div>
                    </div>

                    <!-- Critical Clinical Alert Banner -->
                    <template if:true={selectedPatientHasAlert}>
                        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium care-critical-banner" role="alert">
                            <lightning-icon icon-name="utility:warning" size="small" variant="inverse" class="slds-m-right_small"></lightning-icon>
                            <div class="slds-notify__content">
                                <h2 class="slds-text-heading_small font-bold">
                                    CRITICAL CLINICAL ALERT: Abnormal Vital Sign Detected for {selectedPatient.patientName}
                                </h2>
                                <p class="slds-text-body_small">
                                    Immediate clinical evaluation required. Review hemodynamic instability, oxygenation levels, and adjust care plan accordingly.
                                </p>
                                <div class="slds-m-top_x-small">
                                    <lightning-button
                                        label="Acknowledge Alert"
                                        variant="neutral"
                                        icon-name="utility:check"
                                        onclick={handleQuickAcknowledgeAlert}
                                        class="slds-m-right_x-small">
                                    </lightning-button>
                                    <lightning-button
                                        label="Resolve Clinical Alert"
                                        variant="brand"
                                        icon-name="utility:task"
                                        onclick={handleOpenResolveAlertModal}>
                                    </lightning-button>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Tabs: Vital Signs & Inpatient Encounters -->
                    <div class="slds-card care-panel-card">
                        <lightning-tabset variant="scoped">
                            <!-- Tab 1: Vital Signs History -->
                            <lightning-tab label="Vital Signs Monitor" icon-name="utility:heart">
                                <div class="slds-p-around_medium">
                                    <template if:true={isLoadingVitals}>
                                        <div class="slds-align_absolute-center slds-p-around_medium">
                                            <lightning-spinner alternative-text="Loading vitals..." size="small"></lightning-spinner>
                                        </div>
                                    </template>
                                    <template if:false={isLoadingVitals}>
                                        <template if:true={hasVitals}>
                                            <div class="slds-table_responsive">
                                                <table class="slds-table slds-table_cell-buffer slds-table_bordered care-table">
                                                    <thead>
                                                        <tr class="slds-line-height_reset">
                                                            <th scope="col"><div class="slds-truncate font-bold">Recorded At</div></th>
                                                            <th scope="col"><div class="slds-truncate font-bold">BP (mmHg)</div></th>
                                                            <th scope="col"><div class="slds-truncate font-bold">Pulse</div></th>
                                                            <th scope="col"><div class="slds-truncate font-bold">Temp</div></th>
                                                            <th scope="col"><div class="slds-truncate font-bold">SpO2</div></th>
                                                            <th scope="col"><div class="slds-truncate font-bold">Resp Rate</div></th>
                                                            <th scope="col"><div class="slds-truncate font-bold">Clinical Status</div></th>
                                                            <th scope="col"><div class="slds-truncate font-bold">Clinical Notes</div></th>
                                                            <th scope="col"><div class="slds-truncate font-bold">Alert Actions</div></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template for:each={vitals} for:item="v">
                                                            <tr key={v.vitalId} class={v.rowClass}>
                                                                <td><strong>{v.recordedDateDisplay}</strong></td>
                                                                <td><span class={v.bpClass}>{v.bpDisplay}</span></td>
                                                                <td>{v.pulseDisplay}</td>
                                                                <td>{v.tempDisplay}</td>
                                                                <td><span class={v.spo2Class}>{v.spo2Display}</span></td>
                                                                <td>{v.respRateDisplay}</td>
                                                                <td>
                                                                    <template if:true={v.isResolved}>
                                                                        <span class="slds-badge slds-theme_success font-bold">
                                                                            <lightning-icon icon-name="utility:success" size="xx-small" variant="inverse" class="slds-m-right_xx-small"></lightning-icon>
                                                                            Resolved
                                                                        </span>
                                                                    </template>
                                                                    <template if:false={v.isResolved}>
                                                                        <template if:true={v.alertFlag}>
                                                                            <template if:true={v.isAcknowledged}>
                                                                                <span class="slds-badge slds-theme_warning font-bold">
                                                                                    <lightning-icon icon-name="utility:check" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                                                    Acknowledged
                                                                                </span>
                                                                            </template>
                                                                            <template if:false={v.isAcknowledged}>
                                                                                <span class="slds-badge slds-theme_error font-bold alert-badge-pulse">
                                                                                    <lightning-icon icon-name="utility:warning" size="xx-small" variant="inverse" class="slds-m-right_xx-small"></lightning-icon>
                                                                                    ABNORMAL
                                                                                </span>
                                                                            </template>
                                                                        </template>
                                                                        <template if:false={v.alertFlag}>
                                                                            <span class="slds-badge slds-theme_success">Normal</span>
                                                                        </template>
                                                                    </template>
                                                                </td>
                                                                <td class="slds-cell-wrap">
                                                                    <span>{v.notes}</span>
                                                                    <template if:true={v.resolutionNotes}>
                                                                        <div class="slds-text-body_small slds-text-color_success slds-m-top_xx-small font-semibold">
                                                                            Resolved by {v.resolvedByName}: {v.resolutionNotes}
                                                                        </div>
                                                                    </template>
                                                                </td>
                                                                <td>
                                                                    <template if:true={v.isActionableAlert}>
                                                                        <div class="slds-button-group" role="group">
                                                                            <template if:false={v.isAcknowledged}>
                                                                                <button class="slds-button slds-button_neutral slds-button_x-small" data-vital-id={v.vitalId} onclick={handleTableAcknowledgeAlert}>
                                                                                    Ack
                                                                                </button>
                                                                            </template>
                                                                            <button class="slds-button slds-button_brand slds-button_x-small" data-vital-id={v.vitalId} onclick={handleTableResolveAlert}>
                                                                                Resolve
                                                                            </button>
                                                                        </div>
                                                                    </template>
                                                                    <template if:false={v.isActionableAlert}>
                                                                        <span class="text-muted slds-text-body_small">—</span>
                                                                    </template>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </template>
                                        <template if:false={hasVitals}>
                                            <div class="slds-align_absolute-center slds-p-around_large text-muted">
                                                No vital signs recorded for this admission yet.
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </lightning-tab>

                            <!-- Tab 2: Encounter Notes & Clinical Timeline -->
                            <lightning-tab label="Clinical Encounters" icon-name="utility:note">
                                <div class="slds-p-around_medium">
                                    <template if:true={isLoadingEncounters}>
                                        <div class="slds-align_absolute-center slds-p-around_medium">
                                            <lightning-spinner alternative-text="Loading encounters..." size="small"></lightning-spinner>
                                        </div>
                                    </template>
                                    <template if:false={isLoadingEncounters}>
                                        <template if:true={hasEncounters}>
                                            <ul class="slds-timeline">
                                                <template for:each={encounters} for:item="enc">
                                                    <li key={enc.encounterId} class="slds-timeline__item_expandable slds-m-bottom_medium">
                                                        <div class="encounter-card slds-p-around_small">
                                                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                                                <div>
                                                                    <span class="font-bold text-dark">{enc.encounterType}</span>
                                                                    <span class="slds-badge slds-badge_lightest slds-m-left_small">{enc.encounterCode}</span>
                                                                </div>
                                                                <div class="slds-text-body_small text-muted">{enc.encounterDate}</div>
                                                            </div>
                                                            <div class="slds-text-body_small font-semibold text-primary slds-m-bottom_xx-small">
                                                                Attending: {enc.doctorName}
                                                            </div>
                                                            <div class="slds-m-bottom_xx-small">
                                                                <strong>Chief Complaint:</strong> {enc.chiefComplaint}
                                                            </div>
                                                            <div class="slds-m-bottom_xx-small">
                                                                <strong>Clinical Notes:</strong> {enc.clinicalNotes}
                                                            </div>
                                                            <template if:true={enc.assessment}>
                                                                <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-top_xx-small">
                                                                    <strong>Assessment &amp; Plan:</strong> {enc.assessment}
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </li>
                                                </template>
                                            </ul>
                                        </template>
                                        <template if:false={hasEncounters}>
                                            <div class="slds-align_absolute-center slds-p-around_large text-muted">
                                                No encounters logged for this admission.
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </lightning-tab>
                        </lightning-tabset>
                    </div>
                </template>

                <template if:false={selectedPatient}>
                    <div class="slds-card care-panel-card slds-align_absolute-center slds-p-around_xx-large text-muted">
                        Select an inpatient from the directory to review clinical chart, vitals history, and physician notes.
                    </div>
                </template>
            </div>
        </div>

        <!-- Record Vital Modal -->
        <template if:true={isRecordVitalModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header care-modal-header">
                        <lightning-button-icon icon-name="utility:close" alternative-text="Close" title="Close" variant="bare-inverse" class="slds-modal__close" onclick={handleCloseRecordVitalModal}></lightning-button-icon>
                        <h2 class="slds-text-heading_medium font-bold text-white">Record Patient Vital Signs</h2>
                        <p class="slds-m-top_x-small text-slate-300">{selectedPatient.patientName} • {selectedPatient.bedCode}</p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input type="number" label="Systolic BP (mmHg)" value={newVital.systolic} onchange={handleVitalInput} data-field="systolic" required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input type="number" label="Diastolic BP (mmHg)" value={newVital.diastolic} onchange={handleVitalInput} data-field="diastolic" required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input type="number" label="Pulse / Heart Rate (BPM)" value={newVital.pulse} onchange={handleVitalInput} data-field="pulse" required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input type="number" step="0.1" label="Temperature (°C)" value={newVital.temperature} onchange={handleVitalInput} data-field="temperature" required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input type="number" label="Oxygen Saturation SpO2 (%)" value={newVital.spO2} onchange={handleVitalInput} data-field="spO2" required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                                <lightning-input type="number" label="Respiratory Rate (breaths/min)" value={newVital.respiratoryRate} onchange={handleVitalInput} data-field="respiratoryRate" required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                <lightning-input type="text" label="Clinical Observations / Notes" value={newVital.notes} onchange={handleVitalInput} data-field="notes"></lightning-input>
                            </div>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseRecordVitalModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button label="Save Vital Signs" variant="brand" onclick={handleSubmitRecordVital} disabled={isSubmittingVital}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- New Encounter Modal -->
        <template if:true={isNewEncounterModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header care-modal-header">
                        <lightning-button-icon icon-name="utility:close" alternative-text="Close" title="Close" variant="bare-inverse" class="slds-modal__close" onclick={handleCloseNewEncounterModal}></lightning-button-icon>
                        <h2 class="slds-text-heading_medium font-bold text-white">Log Clinical Inpatient Encounter</h2>
                        <p class="slds-m-top_x-small text-slate-300">{selectedPatient.patientName} • {selectedPatient.bedCode}</p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-m-bottom_small">
                            <lightning-combobox
                                name="encounterType"
                                label="Encounter Type"
                                value={newEncounter.encounterType}
                                options={encounterTypeOptions}
                                onchange={handleEncounterTypeChange}
                                required>
                            </lightning-combobox>
                        </div>
                        <div class="slds-m-bottom_small">
                            <lightning-input
                                label="Chief Complaint"
                                value={newEncounter.chiefComplaint}
                                onchange={handleEncounterInput}
                                data-field="chiefComplaint"
                                required>
                            </lightning-input>
                        </div>
                        <div class="slds-m-bottom_small">
                            <lightning-textarea
                                label="Clinical Notes &amp; Observations"
                                value={newEncounter.notes}
                                onchange={handleEncounterInput}
                                data-field="notes"
                                required>
                            </lightning-textarea>
                        </div>
                        <div class="slds-m-bottom_small">
                            <lightning-textarea
                                label="Assessment &amp; Care Plan"
                                value={newEncounter.assessment}
                                onchange={handleEncounterInput}
                                data-field="assessment">
                            </lightning-textarea>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseNewEncounterModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button label="Save Encounter" variant="brand" onclick={handleSubmitNewEncounter} disabled={isSubmittingEncounter}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Resolve Vital Alert Modal -->
        <template if:true={isResolveAlertModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header care-modal-header">
                        <lightning-button-icon icon-name="utility:close" alternative-text="Close" title="Close" variant="bare-inverse" class="slds-modal__close" onclick={handleCloseResolveAlertModal}></lightning-button-icon>
                        <h2 class="slds-text-heading_medium font-bold text-white">Resolve Clinical Alert</h2>
                        <p class="slds-m-top_x-small text-slate-300">
                            {selectedPatient.patientName} • {selectedPatient.bedCode}
                        </p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                            <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <h2>Resolving this alert confirms that clinical evaluation occurred and corrective treatment has been administered.</h2>
                        </div>
                        <div class="slds-form-element slds-m-bottom_medium">
                            <lightning-textarea
                                label="Clinical Resolution Notes &amp; Action Plan"
                                value={resolutionNotesInput}
                                onchange={handleResolutionNotesChange}
                                placeholder="Detail the medical intervention, patient condition stabilization, medications administered, and ongoing monitoring plan..."
                                required>
                            </lightning-textarea>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseResolveAlertModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button label="Confirm &amp; Resolve Alert" variant="brand" onclick={handleSubmitResolveAlert} disabled={isSubmittingResolution}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>
    </div>
</template>
