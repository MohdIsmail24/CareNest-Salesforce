<template>
    <template lwc:if={isOpen}>
        <!-- Modal Backdrop -->
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>

        <!-- Modal Dialog -->
        <section role="dialog" tabindex="-1" aria-labelledby="reg-modal-heading" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header care-modal-header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <span class="header-icon-box">
                                <lightning-icon icon-name="standard:contact" size="small"></lightning-icon>
                            </span>
                        </div>
                        <div class="slds-media__body slds-text-align_left">
                            <h2 id="reg-modal-heading" class="slds-modal__title slds-hyphenate font-bold header-title">
                                Register Hospital Patient
                            </h2>
                            <p class="header-subtitle">
                                Create an official CareNest patient profile with automated ID generation &amp; duplicate verification
                            </p>
                        </div>
                    </div>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_large care-modal-body" id="reg-modal-content">
                    <template lwc:if={isLoading}>
                        <div class="slds-is-relative spinner-container">
                            <lightning-spinner alternative-text="Registering patient..." size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <!-- Duplicate Warning Alert -->
                    <template lwc:if={isDuplicateWarning}>
                        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium duplicate-alert" role="alert">
                            <lightning-icon icon-name="utility:warning" size="small" class="slds-m-right_small"></lightning-icon>
                            <div class="slds-notify__content">
                                <h3 class="font-bold alert-title">Potential Duplicate Patient Detected</h3>
                                <p class="alert-desc">{duplicateMessage}</p>
                                <div class="duplicate-details slds-m-top_x-small">
                                    <span><strong>Name:</strong> {duplicateInfo.name}</span>
                                    <template lwc:if={duplicateInfo.code}>
                                        <span class="slds-m-left_medium"><strong>Code:</strong> {duplicateInfo.code}</span>
                                    </template>
                                </div>
                                <div class="slds-m-top_small duplicate-actions">
                                    <lightning-button
                                        label="Use Existing Patient"
                                        variant="brand"
                                        icon-name="utility:check"
                                        onclick={handleSelectExistingPatient}
                                        class="slds-m-right_x-small">
                                    </lightning-button>
                                    <lightning-button
                                        label="Confirm &amp; Register As New Patient"
                                        variant="neutral"
                                        icon-name="utility:user"
                                        onclick={handleForceRegister}>
                                    </lightning-button>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Registration Form -->
                    <div class="slds-form slds-form_compound">
                        <div class="slds-form-element__group">
                            <div class="slds-form-element__row">
                                <div class="slds-form-element slds-size_1-of-2">
                                    <lightning-input
                                        type="text"
                                        label="First Name"
                                        name="firstName"
                                        value={form.firstName}
                                        placeholder="e.g. Rahul"
                                        onchange={handleInputChange}>
                                    </lightning-input>
                                </div>
                                <div class="slds-form-element slds-size_1-of-2">
                                    <lightning-input
                                        type="text"
                                        label="Last Name"
                                        name="lastName"
                                        value={form.lastName}
                                        placeholder="e.g. Verma"
                                        required
                                        onchange={handleInputChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <div class="slds-form-element__row slds-m-top_small">
                                <div class="slds-form-element slds-size_1-of-2">
                                    <lightning-input
                                        type="tel"
                                        label="Contact Phone"
                                        name="phone"
                                        value={form.phone}
                                        placeholder="e.g. +91 98765 43210"
                                        onchange={handleInputChange}>
                                    </lightning-input>
                                </div>
                                <div class="slds-form-element slds-size_1-of-2">
                                    <lightning-input
                                        type="email"
                                        label="Email Address"
                                        name="email"
                                        value={form.email}
                                        placeholder="e.g. patient@example.com"
                                        onchange={handleInputChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <div class="slds-form-element__row slds-m-top_small">
                                <div class="slds-form-element slds-size_1-of-2">
                                    <lightning-input
                                        type="date"
                                        label="Date of Birth"
                                        name="birthdate"
                                        value={form.birthdate}
                                        onchange={handleInputChange}>
                                    </lightning-input>
                                </div>
                                <div class="slds-form-element slds-size_1-of-2">
                                    <div class="privacy-note slds-p-around_small slds-m-top_large">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <lightning-icon icon-name="utility:lock" size="x-small" class="slds-m-right_x-small text-slate-500"></lightning-icon>
                                            <span class="slds-text-body_small text-slate-600">
                                                Private Patient Record: Unlinked orphan contact (AccountId = null) protected under strict clinical sharing boundaries.
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer care-modal-footer">
                    <lightning-button label="Cancel" variant="neutral" onclick={handleClose} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button
                        label="Register &amp; Save Patient"
                        variant="brand"
                        icon-name="utility:add"
                        onclick={handleSubmit}
                        disabled={isSubmitDisabled}>
                    </lightning-button>
                </footer>
            </div>
        </section>
    </template>
</template>
